# =============================================================================
# mlt Documentation - Zensical Configuration
# =============================================================================

[project]
site_name = "mlt"
site_description = "An ultra-fast, extensible linter for MATLAB, written in Rust"
site_author = "Mark Shui Hu"
site_url = "https://mlt.dev/"
copyright = """
Copyright &copy; 2026 Mark Shui Hu
"""

# Repository settings for edit links
repo_url = "https://github.com/watermarkhu/mlt"
edit_uri = "blob/main/docs/"
repo_name = "watermarkhu/mlt"

# Navigation structure
nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quick Start" = "getting-started/quickstart.md" },
  ]},
  { "Usage" = [
    { "CLI Reference" = "usage/cli.md" },
    { "Editor Integration" = "usage/editors.md" },
    { "CI/CD" = "usage/ci-cd.md" },
  ]},
  { "Configuration" = "configuration.md" },
  { "Rules" = [
    { "Overview" = "rules.md" },
    { "M001 - Trailing Semicolon" = "m001.md" },
  ]},
]

# -----------------------------------------------------------------------------
# Theme configuration
# -----------------------------------------------------------------------------
[project.theme]
language = "en"

features = [
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

# Light/dark mode toggle — MathWorks blue + orange
[[project.theme.palette]]
scheme = "default"
primary = "blue"
accent = "orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "blue"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Icons
[project.theme.icon]
logo = "lucide/flame"
repo = "fontawesome/brands/github"

# -----------------------------------------------------------------------------
# Social links
# -----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/watermarkhu/mlt"

[[project.extra.social]]
icon = "fontawesome/brands/rust"
link = "https://crates.io/crates/mlt"
