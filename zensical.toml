# =============================================================================
# mlt Documentation - Zensical Configuration
# =============================================================================

[project]
site_name = "mlt"
site_description = "An ultra-fast, extensible linter for MATLAB, written in Rust"
site_author = "Mark Shui Hu"
site_url = "https://mlt.dev/"
copyright = """
Copyright &copy; 2026 Mark Shui Hu
"""

# Repository settings for edit links
repo_url = "https://github.com/watermarkhu/mlt"
edit_uri = "blob/main/docs/"
repo_name = "watermarkhu/mlt"

# Navigation structure
nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quick Start" = "getting-started/quickstart.md" },
  ]},
  { "Usage" = [
    { "CLI Reference" = "usage/cli.md" },
    { "Editor Integration" = "usage/editors.md" },
    { "CI/CD" = "usage/ci-cd.md" },
  ]},
  { "Configuration" = "configuration.md" },
  { "Rules" = [
    { "Overview" = "rules.md" },
    { "NOSEMI - Trailing Semicolon" = "nosemi.md" },
    { "NOFIL - File Not Found" = "nofil.md" },
    { "RDERR - Unable to Read File" = "rderr.md" },
    { "STLOW - Unnecessary UPPER/LOWER" = "stlow.md" },
    { "MFAMB - Ambiguous Identifier" = "mfamb.md" },
    { "COMNL - Comma Newline" = "comnl.md" },
    { "FVINR - Input Attribute" = "fvinr.md" },
    { "QUIT - Analysis Did Not Complete" = "quit.md" },
    { "UNSET - Operator on Left of Assignment" = "unset.md" },
    { "LHROW - Multiple Rows on Left of Assignment" = "lhrow.md" },
    { "RESWD - Invalid Use of a Reserved Word" = "reswd.md" },
    { "SYNEND - Invalid Use for END Operator" = "synend.md" },
    { "MCPLD - Invalid Property Syntax" = "mcpld.md" },
    { "BADNOT - Invalid Use of ~ to Ignore a Value" = "badnot.md" },
    { "BADNOTLHS - Invalid ~ on Left of an Assignment" = "badnotlhs.md" },
    { "BADCT - Directional Formatting Characters" = "badct.md" },
    { "ENDCT2 - END Might Be Missing After a Block Opener" = "endct2.md" },
    { "ENDCT3 - END Might Be Missing Before a Block Opener" = "endct3.md" },
    { "ENDCT4 - METHODS Block or END Missing Before a Function" = "endct4.md" },
    { "STRIN - Unterminated Character Vector" = "strin.md" },
    { "DOUQT - Unterminated Double Quoted String" = "douqt.md" },
    { "INBLK - Unterminated Block Comment" = "inblk.md" },
    { "BADFP - Invalid Floating-Point Constant" = "badfp.md" },
    { "BADHBH - Invalid Hex Literal Digit" = "badhbh.md" },
    { "BADHBB - Invalid Binary Literal Digit" = "badhbb.md" },
    { "BADHBHT - Hex Literal Too Long for Suffix" = "badhbht.md" },
    { "BADHBBT - Binary Literal Too Long for Suffix" = "badhbbt.md" },
    { "HEXTOOLONG - Hex Literal Has Too Many Digits" = "hextoolong.md" },
    { "BINARYTOOLONG - Binary Literal Has Too Many Digits" = "binarytoolong.md" },
    { "SBTMP - Chaining Outputs After Parenthesis" = "sbtmp.md" },
    { "FVSYN - Invalid Function Argument Syntax" = "fvsyn.md" },
    { "FVACI - Name-Value in Cell Indexing" = "fvaci.md" },
    { "FVACS - Quoted String as Name in Name=Value" = "fvacs.md" },
    { "FVAMI - Invalid Name in Name=Value" = "fvami.md" },
    { "NOPAR2 - Missing Closing Bracket (Mid-File)" = "nopar2.md" },
    { "EOLPAR - Missing Closing Bracket at End of Line" = "eolpar.md" },
    { "ENDPAR - Missing Closing Bracket at End of File" = "endpar.md" },
    { "VTPOD - Argument Validation Order" = "vtpod.md" },
  ]},
]

# -----------------------------------------------------------------------------
# Theme configuration
# -----------------------------------------------------------------------------
[project.theme]
language = "en"

features = [
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

# Light/dark mode toggle — MathWorks blue + orange
[[project.theme.palette]]
scheme = "default"
primary = "blue"
accent = "orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "blue"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Icons
[project.theme.icon]
logo = "lucide/flame"
repo = "fontawesome/brands/github"

# -----------------------------------------------------------------------------
# Social links
# -----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/watermarkhu/mlt"

[[project.extra.social]]
icon = "fontawesome/brands/rust"
link = "https://crates.io/crates/mlt"
