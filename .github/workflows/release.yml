name: Release

on:
  push:
    tags:
      # Only match semver tags like v0.1.0, not major version tags like v0.
      - 'v[0-9]*.[0-9]*.[0-9]*'
  # Manual trigger for testing and recovery scenarios.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (skip actual publishing)'
        required: false
        default: true
        type: boolean
      skip_npm:
        description: 'Skip publishing to npm (if already published)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          experimental: true
          install: true

      - name: Download WASI SDK
        run: mise run setup-wasi

      - name: Build WASM
        run: mise run build-wasm

      - name: Prepare package
        run: |
          cp wasm-pkg/README.md crates/mlt_wasm/pkg/
          cp LICENSE crates/mlt_wasm/pkg/
          jq -s '.[0] * .[1]' crates/mlt_wasm/pkg/package.json wasm-pkg/package.json.tmpl > crates/mlt_wasm/pkg/package.json.new
          mv crates/mlt_wasm/pkg/package.json.new crates/mlt_wasm/pkg/package.json

      - name: Upload WASM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-pkg
          path: crates/mlt_wasm/pkg/

  publish:
    name: Publish WASM to npm
    needs: build-wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm --provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-pkg
          path: wasm-pkg

      - name: Setup Node.js
        if: ${{ inputs.skip_npm != true }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Pinned, not @latest: npm 12.0.0 ships a provenance path that fails with
      # "Cannot find module 'sigstore'", so `npm publish --provenance` aborts.
      # 11.18.0 is the last 11.x and supports the OIDC publishing this needs.
      - name: Upgrade npm for OIDC support
        if: ${{ inputs.skip_npm != true }}
        run: |
          npm install -g npm@11.18.0
          echo "npm version: $(npm --version)"

      - name: Publish WASM to npm
        if: ${{ inputs.dry_run != true && inputs.skip_npm != true }}
        run: |
          cd wasm-pkg
          if ! output=$(npm publish --provenance --access public 2>&1); then
            if echo "$output" | grep -q "previously published"; then
              echo "⏭️ WASM package already published, skipping"
            else
              echo "$output"
              exit 1
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Test WASM npm publish (dry run)
        if: ${{ inputs.dry_run == true && inputs.skip_npm != true }}
        run: |
          echo "DRY RUN: Would publish WASM to npm:"
          jq '{name, version}' wasm-pkg/package.json
