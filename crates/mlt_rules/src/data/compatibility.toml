# Compatibility checks data file for mlt.
#
# Each [[checks]] entry represents one MATLAB Code Analyzer compatibility check.
# The compatibility engine uses this to detect deprecated/removed function usage.
#
# Fields:
#   id            - Check ID matching MATLAB Code Analyzer (e.g., "DPSD")
#   function_name - The deprecated function/class name to match against
#   severity      - "error" or "warning"
#   message       - Human-readable diagnostic message
#   category      - "compatibility", "forward-compatibility", or "behavior-changes"
#   pattern       - (optional) "generic" for checks that cannot be matched by function name alone

# =============================================================================
# Compatibility Considerations (891 checks)
# =============================================================================

